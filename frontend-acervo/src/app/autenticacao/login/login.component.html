<div class="container-login">
  <h1 class="titulo">Login</h1>
  
  <form [formGroup]="formularioLogin" (ngSubmit)="onSubmit()" class="formulario">
    <div class="campo-formulario">
      <label for="email">Email Institucional</label>
      <input 
        type="email" 
        id="email" 
        formControlName="email"
        placeholder="seu.email@fatec.sp.gov.br"
        [class.invalido]="email?.invalid && (email?.dirty || email?.touched)"
      >
      <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="mensagem-erro">
        <span *ngIf="email?.errors?.['required']">Email é obrigatório</span>
        <span *ngIf="email?.errors?.['email']">Email inválido</span>
      </div>
    </div>

    <div class="campo-formulario">
      <label for="senha">Senha</label>
      <input 
        type="password" 
        id="senha" 
        formControlName="senha"
        placeholder="Digite sua senha"
        [class.invalido]="senha?.invalid && (senha?.dirty || senha?.touched)"
      >
      <div *ngIf="senha?.invalid && (senha?.dirty || senha?.touched)" class="mensagem-erro">
        <span *ngIf="senha?.errors?.['required']">Senha é obrigatória</span>
      </div>
    </div>

    <button type="submit" class="botao-primario" [disabled]="formularioLogin.invalid || carregando">
      <span *ngIf="!carregando">Entrar</span>
      <span *ngIf="carregando">Carregando...</span>
    </button>

    <div *ngIf="mensagemErro" class="mensagem-erro-geral">
      {{ mensagemErro }}
    </div>

    <div *ngIf="primeiroLogin" class="alerta-primeiro-login">
      <p>Este é seu primeiro acesso. Você será redirecionado para alterar sua senha.</p>
    </div>

    <div class="links-adicionais">
      <a routerLink="/recuperar-senha" class="link">Esqueci minha senha</a>
    </div>
  </form>
</div>
