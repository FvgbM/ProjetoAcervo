<header class="header">
      <div class="logo-container">
        <img 
          src="assets/logo_CPS2.png" 
          alt="Logo Sistema Acervo" 
          class="logo"
          (error)="handleImageError($event)">
      </div>
      
      <nav class="navigation" *ngIf="showNavigation">
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/atas/listar" routerLinkActive="active">Consultar Atas</a>
        <a routerLink="/upload" routerLinkActive="active" *ngIf="isColaborador">Upload</a>
        <a routerLink="/usuarios" routerLinkActive="active" *ngIf="isAdmin">Usuários</a>
        <a 
          routerLink="/atas/criar" 
          routerLinkActive="active" 
          *ngIf="isColaborador"
          class="highlight-link">
          + Nova Ata
        </a>
      </nav>

      <div class="user-info" *ngIf="usuario">
        <span>Olá, {{ usuario.nome }}</span>
        <span class="user-role">({{ getPerfilLabel() }})</span>
        <button (click)="logout()" class="logout-btn">Sair</button>
      </div>
    </header>
