services:
  backend:
    build:
      context: ../backend-acervo
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/acervo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: acervo_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:?Defina MYSQL_APP_PASSWORD no arquivo .env}
      APP_FILE_UPLOAD_DIR: /app/uploads
      APP_FILE_ENCRYPTION_KEY_BASE64: ${FILE_ENCRYPTION_KEY_BASE64:?Defina FILE_ENCRYPTION_KEY_BASE64 no arquivo .env}
    volumes:
      - arquivos_acervo:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - acervo-network

  frontend:
    build:
      context: .
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - acervo-network

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: acervo
      MYSQL_USER: acervo_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Defina MYSQL_APP_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
    volumes:
      - mysql_acervo:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - acervo-network

volumes:
  mysql_acervo:
  arquivos_acervo:

networks:
  acervo-network:
    driver: bridge