spring.application.name=acervo

# Configurações do servidor
server.port=8080

# Configurações do banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/acervo_db
spring.datasource.username=root
spring.datasource.password=#Trabuco01
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Configurações do JPA e Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Configurações específicas do Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.charSet=utf8mb4
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true
# Configurações de upload
diretorio.upload=${user.home}/acervo/uploads
# Configurações de segurança
seguranca.token.expirar=86400000 # 24 horas
# Configurações de e-mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seuemail@gmail.com
spring.mail.password=suasenha
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true